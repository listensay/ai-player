<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>Notion test fixture</title>
  </head>
  <body>
    <p>输入法检查：请分别在两个区域用拼音输入“你好世界”，用候选词提交（不要粘贴）。</p>
    <label>Native note <textarea aria-label="Native note" style="width: 90%; height: 200px"></textarea></label>
    <div
      role="textbox"
      aria-label="Rich note"
      contenteditable="true"
      spellcheck="false"
      style="border: 1px solid #888; min-height: 120px; margin-top: 20px; white-space: pre-wrap"
    ></div>
    <script>
      const field = document.querySelector('textarea')
      const rich = document.querySelector('[contenteditable]')
      field.value = localStorage.getItem(location.pathname) || ''
      const hadCookie = document.cookie.includes('notion_test_session=persistent')
      document.cookie = 'notion_test_session=persistent; max-age=3600; path=/; SameSite=Lax'
      let ipcBlocked = false
      let popup = null
      let popupBlocked = false
      const logins = []
      const composition = []
      const compositionState = { plain: { started: false, ended: false }, rich: { started: false, ended: false } }
      for (const name of [
        'compositionstart',
        'compositionupdate',
        'compositionend',
        'keydown',
        'beforeinput',
        'input',
      ]) {
        for (const editor of [field, rich])
          editor.addEventListener(name, (event) => {
            const state = compositionState[editor === rich ? 'rich' : 'plain']
            if (event.type === 'compositionstart') state.started = true
            if (event.type === 'compositionend') state.ended = true
            composition.push({
              editor: editor === rich ? 'rich' : 'plain',
              type: event.type,
              data: event.data,
              key: event.key,
              composing: event.isComposing,
              inputType: event.inputType,
              text: editor === rich ? rich.textContent : field.value,
            })
            if (composition.length > 100) composition.shift()
            if (event.type === 'compositionend') queueMicrotask(report)
          })
      }
      function report() {
        window.__NOTION_FIXTURE_PROBE__ = {
          userAgent: navigator.userAgent,
          richText: rich.textContent,
          compositionState,
          composition,
          path: location.pathname,
          text: field.value,
          cookie: document.cookie.includes('notion_test_session=persistent'),
          ipcBlocked,
          hadCookie,
          popupBlocked,
          popupClosed: !popup || popup.closed,
          logins,
        }
      }
      field.addEventListener('input', () => {
        localStorage.setItem(location.pathname, field.value)
        report()
      })
      rich.addEventListener('input', report)
      window.startPopupLogin = (blank, hold) => {
        const url = new URL('/popup-auth', location.origin)
        if (hold) url.searchParams.set('hold', '1')
        popup = window.open(blank ? 'about:blank' : url.href, '_blank', 'width=560,height=720')
        popupBlocked = !popup
        if (popup && blank)
          setTimeout(() => {
            popup.location.href = url.href
          }, 30)
        report()
      }
      window.addEventListener('message', (event) => {
        if (event.origin !== location.origin || event.source !== popup || event.data.kind !== 'popup-auth') return
        logins.push({ ...event.data, callbackCookie: document.cookie.includes('notion_popup_session=ok') })
        report()
      })
      setInterval(() => {
        if (popup?.closed) report()
      }, 100)
      setTimeout(async () => {
        try {
          await window.__TAURI_INTERNALS__.invoke('database_request', {
            endpoint: 'library',
            method: 'GET',
            query: {},
            body: null,
          })
        } catch {
          ipcBlocked = true
        }
        if (location.pathname === '/popup-auth' && !location.search.includes('hold')) {
          document.cookie = 'notion_popup_session=ok; max-age=3600; path=/; SameSite=Lax'
          window.opener?.postMessage(
            {
              kind: 'popup-auth',
              hasOpener: !!window.opener,
              sharedSession: hadCookie,
              ipcBlocked,
              userAgent: navigator.userAgent,
            },
            location.origin,
          )
          window.close()
          return
        }
        report()
      }, 200)
    </script>
  </body>
</html>
