[package]
name = "ai-player"
version = "0.1.0"
description = "Local video learning workspace"
edition = "2021"
rust-version = "1.88"

[lib]
name = "ai_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop-smoke = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
# 允许原生 API 请求通过空 Origin 显式省略 WebView 来源；TLS 校验与 URL 权限仍由插件执行。
tauri-plugin-http = { version = "~2.6", features = ["unsafe-headers"] }
tauri-plugin-notification = "2"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSCalendar", "NSTimeZone"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "EKAlarm", "EKCalendar", "EKCalendarItem", "EKEventStore", "EKObject", "EKRecurrenceDayOfWeek", "EKRecurrenceEnd", "EKRecurrenceRule", "EKReminder", "EKSource", "EKTypes", "block2"] }
