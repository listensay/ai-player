name: Check
on: [push, pull_request]
jobs:
  desktop:
    runs-on: macos-latest
    env:
      # CI has no local SSD mount; keep the project's Cargo configuration intact.
      CARGO_TARGET_DIR: ${{ runner.temp }}/ai-player-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run check
      - run: node scripts/desktop-runtime.mjs
      - run: npm run check:rust
      - run: npm run benchmark -- performance.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance.json
      - run: npm run tauri -- build --debug --bundles app
